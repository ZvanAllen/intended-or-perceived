[project]
name = "intended-or-perceived"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai==3.1.0",
    "httpx==0.28.1",
    "imageio-ffmpeg==0.6.0",
    "inspect-ai==0.3.289",
    "openai==3.49.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.17.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
